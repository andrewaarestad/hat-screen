; hat-screen -- firmware for a wearable ST7789 strip display
;
; Target: Seeed Studio XIAO ESP32C3 + 2.25" 76x284 ST7789 SPI TFT
;
; The display is configured entirely through TFT_eSPI build flags below, so
; there is no need to edit User_Setup.h inside the library. If you change a
; pin here, change the matching comment in include/board_config.h too.

[platformio]
default_envs = xiao_esp32c3

[env:xiao_esp32c3]
platform  = espressif32@^6.9.0
board     = seeed_xiao_esp32c3
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -Isrc

    ; ---- XIAO ESP32C3 uses the native USB CDC port for Serial ----
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

    ; ---- TFT_eSPI configuration -------------------------------------------
    ; Everything the library would normally read from User_Setup.h.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1

    ; NOTE: these are the ST7789 controller's full framebuffer dimensions, not
    ; the dimensions of our panel. The 76x284 glass only exposes a window into
    ; this 240x320 GRAM, and we select that window with a viewport at runtime
    ; (see src/display/Display.cpp and docs/DISPLAY_NOTES.md).
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320

    ; Most ST7789 panels ship with inverted colour. If your display comes up
    ; as a photo negative, remove this flag.
    -D TFT_INVERSION_ON=1
    ; If reds and blues are swapped, change TFT_BGR to TFT_RGB.
    -D TFT_RGB_ORDER=TFT_BGR

    ; ---- Pin map (see include/board_config.h for the D-pin equivalents) ----
    -D TFT_MOSI=10
    -D TFT_SCLK=8
    -D TFT_CS=3
    -D TFT_DC=4
    -D TFT_RST=5
    -D TFT_MISO=-1
    ; Backlight is driven with LEDC PWM by our own code, so TFT_eSPI must not
    ; claim the pin.
    -D TFT_BL=-1

    ; ---- Fonts ------------------------------------------------------------
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    ; ---- SPI --------------------------------------------------------------
    ; 40 MHz is safe on short jumper wires. Long/thin wiring in a hat may need
    ; to drop to 27000000 or 20000000.
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

; Same firmware, verbose logging over the USB CDC serial port.
[env:xiao_esp32c3_debug]
extends    = env:xiao_esp32c3
build_type = debug
build_flags =
    ${env:xiao_esp32c3.build_flags}
    -D HAT_DEBUG=1
    -D CORE_DEBUG_LEVEL=4

; Draws a 1 px frame on the panel edge and halts, so the GRAM offsets in
; include/board_config.h can be checked against the real glass.
; See docs/DISPLAY_NOTES.md.
[env:xiao_esp32c3_calibrate]
extends = env:xiao_esp32c3
build_flags =
    ${env:xiao_esp32c3.build_flags}
    -D HAT_CALIBRATE=1
